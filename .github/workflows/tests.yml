name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.13"]
    defaults:
      run:
        working-directory: source
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and contract tests
        run: |
          set -o pipefail
          python -c "import shutil, sys; print(sys.version); print('bash:', shutil.which('bash'))"
          python -m unittest discover -s .agents/tests -p "test_*.py" -v 2>&1 | tee test-output.txt
      - name: Report failing tests as annotations
        if: failure()
        run: python ../.github/scripts/annotate_failures.py test-output.txt
      - name: AGENT_CONTEXT.md is up to date
        run: |
          python .agents/tools/export_context.py --output .agents/AGENT_CONTEXT.md
          git diff --exit-code -- .agents/AGENT_CONTEXT.md
